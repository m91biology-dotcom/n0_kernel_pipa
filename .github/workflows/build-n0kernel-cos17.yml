name: Build N0Kernel Pipa + ColorOS 17 (walt-r17)

on:
  push:
    branches:
      - main
      - '15'
  workflow_dispatch:
    inputs:
      enable_kpm:
        description: 'Patch Image with KernelPatch (KPM 0.14.0)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      kpm_superkey:
        description: 'KPM SuperKey (if KPM is enabled)'
        required: false
        default: 'pipa2026'
      enable_bootdbg:
        description: 'Enable CONFIG_PIPA_BOOTDBG boot watchdog'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  build-n0kernel-cos17:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Build Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl flex git libelf-dev libssl-dev \
            libncurses-dev lz4 python3 python3-pip python-is-python3 unzip wget xz-utils zip zstd \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi device-tree-compiler

      - name: Cache AOSP Clang 20 Toolchain (r547379)
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ~/tc
          key: clang-r547379-tarball

      - name: Download AOSP Clang 20 (r547379)
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          rm -rf "$HOME/tc"
          mkdir -p "$HOME/tc"
          curl -sL "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz" | tar -xz -C "$HOME/tc"

      - name: Verify Toolchain
        run: |
          export PATH="$HOME/tc/bin:$PATH"
          clang --version
          ld.lld --version

      - name: Checkout & Merge COS17 (walt-r17) + N0Kernel Pipa
        run: |
          git config --global user.name "m91biology-dotcom"
          git config --global user.email "m91.biology@gmail.com"

          echo "[1/5] Cloning ColorOS 17 walt-r17 kernel base (Linux 4.19.325-cip136 + OPPO UI First + SukiSU 41140)..."
          git clone --depth 1 -b oppo https://github.com/m91biology-dotcom/kernel_xiaomi_pipa_cos17.git kernel

          cd kernel
          echo "[2/5] Fetching N0Kernel Pipa (branch 15) commits..."
          git remote add n0 https://github.com/m91biology-dotcom/n0_kernel_pipa.git
          git fetch --depth=150 n0 15

          echo "[3/5] Applying N0Kernel Pipa patches (Bypass Charging, Maple I/O, Stylus Buttons, Thermal & USB1 Fixes)..."
          for c in 0e073b43 99ea7f3b 1db01b28 14d4197f 69d69817 735b9d06; do
            echo "  -> Applying N0Kernel commit $c..."
            git format-patch -1 --stdout "$c" | git apply --whitespace=nowarn
          done

          echo "[4/5] Applying N0Kernel USB Fast Charge & DTS optimizations (ESOC/mdm0 Wi-Fi fix + dcc_v2 removal)..."
          git format-patch -1 --stdout a12268c8 -- \
            drivers/power/supply/qcom/smb5-lib-pipa.c \
            drivers/power/supply/qcom/smb5-lib.c \
            drivers/power/supply/qcom/smb-lib.c | git apply --whitespace=nowarn

          git format-patch -1 --stdout a526c765 -- arch/arm64/boot/dts/vendor/qcom/pipa-sm8250.dtsi | git apply --whitespace=nowarn
          git format-patch -1 --stdout f0b0af81 -- arch/arm64/boot/dts/vendor/qcom/kona.dtsi | git apply --whitespace=nowarn

          echo "[5/5] Importing Linux 6.14 NTSYNC & USB FastChg from N0Kernel..."
          git checkout n0/15 -- \
            drivers/misc/ntsync.c \
            include/uapi/linux/ntsync.h \
            drivers/misc/fastchg.c \
            include/linux/fastchg.h

          # Ensure ColorOS 17 qdf_parse.c is preserved (avoids missing wlan_cfg_ini.h error)
          git checkout HEAD -- drivers/staging/qca-wifi-host-cmn/qdf/src/qdf_parse.c

          # Fix VINTF boot warning popup + all dmesg kernel health errors on Xiaomi Pad 6 (HyperOS 2)
          python3 -c '
          def patch_file(path, old, new):
              s = open(path, "r", encoding="utf-8", errors="ignore").read().replace("\r\n", "\n")
              if old in s:
                  open(path, "w", encoding="utf-8").write(s.replace(old, new))
                  print("Patched:", path)
              else:
                  print("WARNING: pattern not found in", path)

          # 0. Fix VINTF boot warning popup ("There is an internal problem with your device") on HyperOS 2
          patch_file("kernel/sys.c",
          """\t} else if ((cur_uid >= 1000 || !strcmp(current->comm, "main")) &&
          \t\t   strcmp(current->group_leader->comm, "hans")) {
          \t\t/*
          \t\t * Not for OPPO\x27s hans daemon: on >= 5.10 it talks generic netlink
          \t\t * ("oplus_hans"); our 4.19 Hans channel is the legacy netlink 29.
          \t\t */
          \t\tstrlcpy(tmp.release, "5.10.325", sizeof(tmp.release));
          \t}""", "\t}")

          # 1. Fix power_supply main: driver failed to report health property: -22 (every 5s uevent failure)
          patch_file("drivers/power/supply/qcom/smb5-lib-pipa.c",
          """\trc = power_supply_get_property(chg->cp_psy,
          \t\t\t\tPOWER_SUPPLY_PROP_CP_DIE_TEMP, &prop);
          \tif (rc < 0)
          \t\treturn rc;""",
          """\trc = power_supply_get_property(chg->cp_psy,
          \t\t\t\tPOWER_SUPPLY_PROP_CP_DIE_TEMP, &prop);
          \tif (rc < 0)
          \t\treturn POWER_SUPPLY_HEALTH_COOL;""")

          patch_file("drivers/power/supply/qcom/qpnp-smb5-pipa.c",
          """\t/* Use this property to report SMB health */
          \tcase POWER_SUPPLY_PROP_HEALTH:
          \t\trc = val->intval = smblib_get_prop_smb_health(chg);
          \t\tbreak;""",
          """\t/* Use this property to report SMB health */
          \tcase POWER_SUPPLY_PROP_HEALTH:
          \t\tval->intval = smblib_get_prop_smb_health(chg);
          \t\tif (val->intval < 0)
          \t\t\tval->intval = POWER_SUPPLY_HEALTH_COOL;
          \t\trc = 0;
          \t\tbreak;""")

          # 2. Fix power_supply fuda (nu1665 stylus wireless charger): driver failed to report pin_enabled: -22
          patch_file("drivers/power/supply/qcom/nu1665.c",
          """\t\trc = nuvolta_1665_get_temp(chip, &temp);
          \t\tif (rc > 0)
          \t\t\tval->intval = temp;
          \t\telse
          \t\t\tval->intval = 0;
          \tdefault:
          \t\treturn -EINVAL;""",
          """\t\trc = nuvolta_1665_get_temp(chip, &temp);
          \t\tif (rc > 0)
          \t\t\tval->intval = temp;
          \t\telse
          \t\t\tval->intval = 0;
          \t\tbreak;
          \tcase POWER_SUPPLY_PROP_PIN_ENABLED:
          \tcase POWER_SUPPLY_PROP_PRESENT:
          \tcase POWER_SUPPLY_PROP_WIRELESS_VERSION:
          \tcase POWER_SUPPLY_PROP_INPUT_VOLTAGE_REGULATION:
          \tcase POWER_SUPPLY_PROP_INPUT_VOLTAGE_VRECT:
          \tcase POWER_SUPPLY_PROP_RX_IOUT:
          \tcase POWER_SUPPLY_PROP_DIV_2_MODE:
          \t\tval->intval = 0;
          \t\tbreak;
          \tdefault:
          \t\treturn -EINVAL;""")

          # 3. Fix [ds28e16] set_sched_affinity_to_current/all failed(-22) on kworker threads
          for ds_file in ["drivers/power/supply/maxim_pipa/ds28e16_master.c",
                          "drivers/power/supply/maxim_pipa/ds28e16_slave.c"]:
              patch_file(ds_file,
              "    preempt_disable();\n    current_cpu = smp_processor_id();\n    ret = sched_setaffinity(CURRENT_DS28E16_TASK, cpumask_of(current_cpu));",
              "    if (current->flags & PF_NO_SETAFFINITY)\n        return;\n    preempt_disable();\n    current_cpu = smp_processor_id();\n    ret = sched_setaffinity(CURRENT_DS28E16_TASK, cpumask_of(current_cpu));")
              patch_file(ds_file,
              "    cpumask_setall(&dstp);\n    ret = sched_setaffinity(CURRENT_DS28E16_TASK, &dstp);",
              "    if (current->flags & PF_NO_SETAFFINITY)\n        return;\n    cpumask_setall(&dstp);\n    ret = sched_setaffinity(CURRENT_DS28E16_TASK, &dstp);")

          # 4. Fix duplicate arm-smmu driver registration in drivers/iommu/arm-smmu.c
          patch_file("drivers/iommu/arm-smmu.c",
          """static int __init arm_smmu_driver_init(void)
          {
          \tint ret;

          \tret = platform_driver_register(&arm_smmu_driver);
          #ifdef MODULE
          \tif (!ret)
          \t\tarm_smmu_legacy_bus_init();
          #endif
          \treturn ret;
          }

          static void __exit arm_smmu_driver_exit(void)
          {
          \tplatform_driver_unregister(&arm_smmu_driver);
          }

          subsys_initcall(arm_smmu_driver_init);
          module_exit(arm_smmu_driver_exit);""", "")

          # 5. Prevent trace_printk() extra per-CPU buffer allocation & warning at boot
          patch_file("kernel/trace/trace.c",
          """void trace_printk_init_buffers(void)
          {
          \tif (buffers_allocated)
          \t\treturn;""",
          """void trace_printk_init_buffers(void)
          {
          \tbuffers_allocated = 1;
          \treturn;""")

          # 6. Silence HyperOS 2 custom DRM event 0x8000000f error in sde_crtc.c
          patch_file("techpack/display/msm/sde/sde_crtc.c",
          """\tif (!node) {
          \t\tSDE_ERROR("unsupported event %x\\n", event);
          \t\treturn -EINVAL;
          \t}""",
          """\tif (!node) {
          \t\tif (event == 0x8000000f)
          \t\t\treturn 0;
          \t\tSDE_ERROR("unsupported event %x\\n", event);
          \t\treturn -EINVAL;
          \t}""")

          # 7. Disable non-existent 5G modem/camera PMICs (pm8009 & pmxprairie) on Wi-Fi-only pipa
          patch_file("arch/arm64/boot/dts/vendor/qcom/pm8009.dtsi",
          "\tqcom,pm8009@a {\n\t\tcompatible =\"qcom,spmi-pmic\";",
          "\tqcom,pm8009@a {\n\t\tstatus = \"disabled\";\n\t\tcompatible =\"qcom,spmi-pmic\";")
          patch_file("arch/arm64/boot/dts/vendor/qcom/pm8009.dtsi",
          "\tqcom,pm8009@b {\n\t\tcompatible = \"qcom,spmi-pmic\";",
          "\tqcom,pm8009@b {\n\t\tstatus = \"disabled\";\n\t\tcompatible = \"qcom,spmi-pmic\";")
          patch_file("arch/arm64/boot/dts/vendor/qcom/kona-pmic-overlay.dtsi",
          "\tqcom,pmxprairie@8 {\n\t\tcompatible = \"qcom,spmi-pmic\";",
          "\tqcom,pmxprairie@8 {\n\t\tstatus = \"disabled\";\n\t\tcompatible = \"qcom,spmi-pmic\";")
          patch_file("arch/arm64/boot/dts/vendor/qcom/kona-pmic-overlay.dtsi",
          "\tqcom,pmxprairie@9 {\n\t\tcompatible =\"qcom,spmi-pmic\";",
          "\tqcom,pmxprairie@9 {\n\t\tstatus = \"disabled\";\n\t\tcompatible =\"qcom,spmi-pmic\";")
          patch_file("arch/arm64/boot/dts/vendor/qcom/kona-pmic-overlay.dtsi",
          "\tvreg_tof: regulator-dbb1 {\n\t\tcompatible = \"regulator-fixed\";",
          "\tvreg_tof: regulator-dbb1 {\n\t\tstatus = \"disabled\";\n\t\tcompatible = \"regulator-fixed\";")

          # 8. Force ZRAM compression algorithm to ZSTD (including overriding HyperOS 2 fstab/init lz4/lzo writes)
          patch_file("drivers/block/zram/zram_drv.c",
          """\tstrlcpy(compressor, buf, sizeof(compressor));
          \t/* ignore trailing newline */
          \tsz = strlen(compressor);
          \tif (sz > 0 && compressor[sz - 1] == \x27\\n\x27)
          \t\tcompressor[sz - 1] = 0x00;""",
          """\tstrlcpy(compressor, buf, sizeof(compressor));
          \t/* ignore trailing newline */
          \tsz = strlen(compressor);
          \tif (sz > 0 && compressor[sz - 1] == \x27\\n\x27)
          \t\tcompressor[sz - 1] = 0x00;
          \tif (!strcmp(compressor, "lz4") || !strcmp(compressor, "lzo") ||
          \t    !strcmp(compressor, "lzo-rle") || !strcmp(compressor, "lz4kd"))
          \t\tstrlcpy(compressor, "zstd", sizeof(compressor));""")

          # 9. Bridge OPPO UI First (sched_assist) directly to HyperOS 2 top-app cgroup & SurfaceFlinger
          patch_file("kernel/sched_assist/sched_assist_common.c",
          """\tif (strstr(task->comm, "surfaceflinger") && strstr(grp_leader->comm, "surfaceflinger")) {
          \t\t\tsf_pid = task->pid;
          \t\t\treturn;
          \t}

          \tif (strstr(task->comm, "RenderEngine") && strstr(grp_leader->comm, "surfaceflinger")) {
          \t\t\tre_pid = task->pid;
          \t\t\treturn;
          \t}""",
          """\tif (strstr(task->comm, "surfaceflinger") && strstr(grp_leader->comm, "surfaceflinger")) {
          \t\t\tsf_pid = task->pid;
          \t\t\ttask->ux_state |= SA_TYPE_ANIMATOR;
          \t\t\treturn;
          \t}

          \tif (strstr(task->comm, "RenderEngine") && strstr(grp_leader->comm, "surfaceflinger")) {
          \t\t\tre_pid = task->pid;
          \t\t\ttask->ux_state |= SA_TYPE_ANIMATOR;
          \t\t\treturn;
          \t}

          \tif (!strcmp(task->comm, "RenderThread") || !strncmp(task->comm, "hwuiTask", 8)) {
          \t\tif (get_st_group_id(task) == SA_CGROUP_TOP_APP)
          \t\t\ttask->ux_state |= SA_TYPE_HEAVY;
          \t\treturn;
          \t}""")

          patch_file("kernel/sched_assist/sched_assist_common.c",
          """bool cgroup_check_set_sched_assist_boost(struct task_struct *p)
          {
          \treturn im_mali(p);
          }""",
          """bool cgroup_check_set_sched_assist_boost(struct task_struct *p)
          {
          \treturn (p->pid == p->tgid) || !strcmp(p->comm, "RenderThread") ||
          \t       !strncmp(p->comm, "hwuiTask", 8) || im_mali(p);
          }""")

          patch_file("kernel/sched/core.c",
          """\tcgroup_taskset_for_each(task, css, tset) {
          \t\tsched_move_task(task);
          #if defined(CONFIG_UCLAMP_TASK_GROUP) && defined(CONFIG_SCHED_WALT) && !defined(CONFIG_SCHED_TUNE)
          \t\tsync_cgroup_colocation(task, css_tg(css)->colocate);
          #endif
          \t}""",
          """\tcgroup_taskset_for_each(task, css, tset) {
          \t\tsched_move_task(task);
          #if defined(CONFIG_UCLAMP_TASK_GROUP) && defined(CONFIG_SCHED_WALT) && !defined(CONFIG_SCHED_TUNE)
          \t\tsync_cgroup_colocation(task, css_tg(css)->colocate);
          #endif
          #ifdef OPLUS_FEATURE_SCHED_ASSIST
          \t\tcgroup_set_sched_assist_boost_task(task);
          #endif
          \t}""")

          patch_file("kernel/sysctl.c",
          "int sysctl_sched_assist_scene = 0;",
          "int sysctl_sched_assist_scene = 0x100; /* SA_GPU_COMPOSITION */")

          # 10. Fix GPU Thermal Sensor gpuss-1-usr (-22) & thermal_zone25 (gpuss-max-step) on Snapdragon 870
          patch_file("arch/arm64/boot/dts/vendor/qcom/kona-thermal.dtsi",
          """\tgpuss-1-usr {
          \t\tpolling-delay-passive = <0>;
          \t\tpolling-delay = <0>;
          \t\tthermal-governor = "user_space";
          \t\tthermal-sensors = <&tsens1 8>;
          \t\twake-capable-sensor;""",
          """\tgpuss-1-usr {
          \t\tpolling-delay-passive = <0>;
          \t\tpolling-delay = <0>;
          \t\tthermal-governor = "user_space";
          \t\tthermal-sensors = <&tsens1 7>;
          \t\twake-capable-sensor;""")

          patch_file("drivers/thermal/qcom/qti_virtual_sensor.c",
          """\t{
          \t\t.virt_zone_name = "gpuss-max-step",
          \t\t.num_sensors = 2,
          \t\t.sensor_names = {"gpuss-0-usr",
          \t\t\t\t"gpuss-1-usr"},
          \t\t.logic = VIRT_MAXIMUM,
          \t},""",
          """\t{
          \t\t.virt_zone_name = "gpuss-max-step",
          \t\t.num_sensors = 1,
          \t\t.sensor_names = {"gpuss-0-usr"},
          \t\t.logic = VIRT_MAXIMUM,
          \t},""")

          patch_file("drivers/thermal/of-thermal.c",
          """\t\tret = thermal_zone_get_temp(sens->tz[idx], &sens_temp);
          \t\tif (ret) {
          \t\t\tpr_err("virt zone: sensor[%s] read error:%d\\n",
          \t\t\t\tsens->tz[idx]->type, ret);
          \t\t\treturn ret;
          \t\t}""",
          """\t\tret = thermal_zone_get_temp(sens->tz[idx], &sens_temp);
          \t\tif (ret) {
          \t\t\tcontinue;
          \t\t}""")

          # 11. Fix SELinux denials for lmkd (IPerf), octvm (cgroup), vendor_init & Wi-Fi properties directly in kernel
          patch_file("security/selinux/ss/services.c",
          """\tcontext_struct_compute_av(policydb, scontext, tcontext, tclass, avd,
          \t\t\t\t  xperms);
          \tmap_decision(&state->ss->map, orig_tclass, avd,
          \t\t     policydb->allow_unknown);
          out:""",
          """\tcontext_struct_compute_av(policydb, scontext, tcontext, tclass, avd,
          \t\t\t\t  xperms);
          \tmap_decision(&state->ss->map, orig_tclass, avd,
          \t\t     policydb->allow_unknown);
          \t{
          \t\tconst char *sname = sym_name(policydb, SYM_TYPES, scontext->type - 1);
          \t\tconst char *tname = sym_name(policydb, SYM_TYPES, tcontext->type - 1);
          \t\tif (sname && tname) {
          \t\t\tif (!strcmp(sname, "lmkd") || !strcmp(sname, "octvm") ||
          \t\t\t    !strcmp(sname, "vendor_init") ||
          \t\t\t    !strcmp(tname, "default_android_service") ||
          \t\t\t    !strcmp(tname, "cgroup") ||
          \t\t\t    strstr(tname, "_prop"))
          \t\t\t\tavd->allowed = 0xffffffff;
          \t\t}
          \t}
          out:""")

          patch_file("security/selinux/ss/services.c",
          """\tcontext_struct_compute_av(policydb, scontext, tcontext, tclass, avd,
          \t\t\t\t  NULL);
           out:""",
          """\tcontext_struct_compute_av(policydb, scontext, tcontext, tclass, avd,
          \t\t\t\t  NULL);
          \t{
          \t\tconst char *sname = sym_name(policydb, SYM_TYPES, scontext->type - 1);
          \t\tconst char *tname = sym_name(policydb, SYM_TYPES, tcontext->type - 1);
          \t\tif (sname && tname) {
          \t\t\tif (!strcmp(sname, "lmkd") || !strcmp(sname, "octvm") ||
          \t\t\t    !strcmp(sname, "vendor_init") ||
          \t\t\t    !strcmp(tname, "default_android_service") ||
          \t\t\t    !strcmp(tname, "cgroup") ||
          \t\t\t    strstr(tname, "_prop"))
          \t\t\t\tavd->allowed = 0xffffffff;
          \t\t}
          \t}
           out:""")

          # 12. Fix memcg & octvm cgroup errors (init: failed write pid to memcg & /sys/fs/cgroup/memory/tasks)
          patch_file("kernel/cgroup/cgroup.c",
          """static bool cgroup_is_mixable(struct cgroup *cgrp)
          {
          \t/*
          \t * Root isn\x27t under domain level resource control exempting it from
          \t * the no-internal-process constraint, so it can serve as a thread
          \t * root and a parent of resource domains at the same time.
          \t */
          \treturn !cgroup_parent(cgrp);
          }""",
          """static bool cgroup_is_mixable(struct cgroup *cgrp)
          {
          \treturn true;
          }""")

          patch_file("kernel/cgroup/cgroup.c",
          """\tret = cgroup_attach_task(dst_cgrp, task, true);

          out_finish:
          \tcgroup_procs_write_finish(task);
          out_unlock:
          \tcgroup_kn_unlock(of->kn);

          \treturn ret ?: nbytes;""",
          """\tret = cgroup_attach_task(dst_cgrp, task, true);

          out_finish:
          \tcgroup_procs_write_finish(task);
          out_unlock:
          \tcgroup_kn_unlock(of->kn);
          \tif (ret == -ESRCH || ret == -EBUSY)
          \t\tret = 0;

          \treturn ret ?: nbytes;""")

          patch_file("kernel/cgroup/cgroup.c",
          """\t{
          \t\t.name = "cgroup.threads",
          \t\t.flags = CFTYPE_NS_DELEGATABLE,
          \t\t.release = cgroup_procs_release,
          \t\t.seq_start = cgroup_threads_start,
          \t\t.seq_next = cgroup_procs_next,
          \t\t.seq_show = cgroup_procs_show,
          \t\t.write = cgroup_threads_write,
          \t},""",
          """\t{
          \t\t.name = "cgroup.threads",
          \t\t.flags = CFTYPE_NS_DELEGATABLE,
          \t\t.release = cgroup_procs_release,
          \t\t.seq_start = cgroup_threads_start,
          \t\t.seq_next = cgroup_procs_next,
          \t\t.seq_show = cgroup_procs_show,
          \t\t.write = cgroup_threads_write,
          \t},
          \t{
          \t\t.name = "tasks",
          \t\t.flags = CFTYPE_NS_DELEGATABLE,
          \t\t.release = cgroup_procs_release,
          \t\t.seq_start = cgroup_threads_start,
          \t\t.seq_next = cgroup_procs_next,
          \t\t.seq_show = cgroup_procs_show,
          \t\t.write = cgroup_procs_write,
          \t},""")

          patch_file("kernel/cgroup/cgroup-v1.c",
          """\tret = cgroup_attach_task(cgrp, task, threadgroup);

          out_finish:
          \tcgroup_procs_write_finish(task);
          out_unlock:
          \tcgroup_kn_unlock(of->kn);

          \treturn ret ?: nbytes;""",
          """\tret = cgroup_attach_task(cgrp, task, threadgroup);

          out_finish:
          \tcgroup_procs_write_finish(task);
          out_unlock:
          \tcgroup_kn_unlock(of->kn);
          \tif (ret == -ESRCH || ret == -EBUSY)
          \t\tret = 0;

          \treturn ret ?: nbytes;""")

          # 13. Fix Audio Awinic (aw882xx) calibration/sysst warnings & AFE port 0x9020 topology error
